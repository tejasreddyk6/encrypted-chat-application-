<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Encrypted Chat</title>

    <link rel="stylesheet" href="style.css">

    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

    <!-- ========================= -->
    <!-- LOGIN SCREEN -->
    <!-- ========================= -->

    <div class="app">

        <div class="login-screen" id="loginBox">

            <div class="login-card">

                <div class="login-icon">
                    🔐
                </div>

                <h1>Encrypted Chat</h1>

                <p class="login-subtitle">
                    Secure Real-Time Messaging
                </p>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

                <input
                    type="password"
                    id="secretKey"
                    placeholder="Enter secret key"
                    autocomplete="off"
                >

                <button
                    class="join-button"
                    onclick="joinChat()"
                >
                    Join Secure Chat
                </button>

                <div class="security-note">
                    🔒 Messages are encrypted before transmission
                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- CHAT SCREEN -->
        <!-- ========================= -->

        <div
            class="chat-container"
            id="chatContainer"
        >

            <!-- CHAT HEADER -->

            <div class="chat-header">

                <div class="chat-user">

                    <div class="profile-circle">
                        🔐
                    </div>

                    <div>

                        <div
                            class="chat-title"
                            id="welcome"
                        >
                            Encrypted Chat
                        </div>

                        <div class="online-status">
                            🟢 Secure chat
                        </div>

                    </div>

                </div>

                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>


            <!-- MESSAGES -->

            <div id="messages"></div>


            <!-- MESSAGE INPUT AREA -->

            <div class="message-area">

                <div class="attachment-buttons">

                    <!-- PHOTO -->

                    <label
                        for="photoInput"
                        class="attachment-button photo-button"
                    >
                        📷
                        <span>Photo</span>
                    </label>

                    <input
                        type="file"
                        id="photoInput"
                        accept="image/*"
                        hidden
                    >


                    <!-- DOCUMENT -->

                    <label
                        for="documentInput"
                        class="attachment-button document-button"
                    >
                        📄
                        <span>Document</span>
                    </label>

                    <input
                        type="file"
                        id="documentInput"
                        accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx"
                        hidden
                    >

                </div>


                <div class="typing-area">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >

                    <button
                        class="send-button"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
